services:
  - type: web
    name: scanplant-api
    runtime: docker
    dockerfilePath: ./ScanPlantAPI/ScanPlantAPI/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:$PORT
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: ScanPlantAPI
      - key: Jwt__Audience
        value: ScanPlantApp
      - key: DATABASE_URL
        fromDatabase:
          name: scanplant-db
          property: connectionString
          
databases:
  - name: scanplant-db
    databaseName: scanplant
    user: scanplant
