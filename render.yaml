services:
  - type: web
    name: scanplant-api
    runtime: dotnet
    rootDir: ScanPlantAPI/ScanPlantAPI
    buildCommand: dotnet publish -c Release -o out
    startCommand: cd out && dotnet ScanPlantAPI.dll --urls http://0.0.0.0:$PORT
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: ScanPlantAPI
      - key: Jwt__Audience
        value: ScanPlantApp
      - key: DATABASE_URL
        fromDatabase:
          name: scanplant-db
          property: connectionString
          
databases:
  - name: scanplant-db
    databaseName: scanplant
    user: scanplant
