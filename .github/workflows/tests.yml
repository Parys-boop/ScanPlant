name: Test Suite

on:
  push:
    branches:
      - master
      - experiment/**
      - feature/tdd-*
      - chore/tdd-*
      - codex/experiment/**
      - codex/feature/tdd-*
      - codex/chore/tdd-*
  pull_request:
    branches:
      - master
      - experiment/**
      - feature/tdd-*
      - chore/tdd-*
      - codex/experiment/**
      - codex/feature/tdd-*
      - codex/chore/tdd-*

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API dependencies
        run: dotnet restore ScanPlantAPI/ScanPlantAPI/ScanPlantAPI.sln

      - name: Run API tests with coverage
        run: dotnet test ScanPlantAPI/ScanPlantAPI/ScanPlantAPI.sln --configuration Release --collect:"XPlat Code Coverage"

  web-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scanplant-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanplant-web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test -- --run

      - name: Build web app
        run: npm run build
